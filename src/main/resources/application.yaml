spring:
  application:
    name: underwriting_service

  mongodb:
    uri: mongodb://localhost:27017/underwriting_db
  
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

server:
  port: 7777